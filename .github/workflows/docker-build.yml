name: Docker build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build and test linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: dsg-project:ci
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Verify image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(docker image inspect dsg-project:ci --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
      - name: Smoke test container with synthetic data
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" dsg-project:ci --help
          result=$(docker run --rm --platform "$PLATFORM" --mount type=bind,source="$PWD/examples",target=/data,readonly dsg-project:ci /data/sample.csv)
          test "$result" = '{"columns": ["name", "value"], "rows": 2}'
